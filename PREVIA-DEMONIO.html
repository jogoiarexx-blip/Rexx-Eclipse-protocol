<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REXX — Laboratório do demônio</title><link rel="stylesheet" href="css/demonPreview.css"><script defer src="js/config.js"></script><script defer src="js/core/demonSprites.js"></script><script defer src="js/ui/demonPreview.js"></script></head><body><main><header><span>REXX / ECLIPSE PROTOCOL</span><h1>Caçador da Fenda</h1><p>Um atlas. Dois sentidos. Seis animações.</p></header><canvas id="preview" width="1000" height="480" aria-label="Prévia animada do demônio"></canvas><p id="status" role="status">Carregando WebP…</p><section><label>Animação <select id="mode"><option value="idle">Repouso</option><option value="run" selected>Corrida</option><option value="attack">Ataque</option><option value="hurt">Dano</option><option value="laugh">Risada</option><option value="death">Morte</option></select></label><button id="flip">Inverter direção</button><button id="pause">Pausar</button><button id="step">Avançar frame</button><button id="restart">Recomeçar</button><label><input id="hitbox" type="checkbox" checked> Hitbox e pivô</label><label>Velocidade <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"></label><label>Fundo <input id="background" type="color" value="#132c35"></label></section><p>Setas ← → mudam apenas a direção. Espaço pausa. Ataque, dano e morte param no último frame: use Recomeçar para repetir.</p><a href="index.html">Voltar ao jogo</a></main></body></html>
