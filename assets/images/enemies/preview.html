<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REXX · Sprites por fase</title><style>body{margin:0;padding:28px;background:#09151e;color:#e0f8ed;font:15px Arial}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:25px}h1{font-size:25px;margin:0}select,button,input{background:#17323d;color:#c5ffdd;border:1px solid #4b817c;padding:10px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}article{border:1px solid #294551;border-radius:6px;background:#10232d;padding:15px;text-align:center}canvas{width:180px;height:190px;image-rendering:pixelated}h3{font-size:14px}small,p{color:#91aeb8}label{display:flex;align-items:center;gap:8px}</style><header><h1>REXX / ARQUIVO DE INIMIGOS</h1><select id="phase" aria-label="Fase"></select><button id="pause">Pausar animação</button><label>FPS <input id="fps" type="range" min="1" max="12" value="8"><span id="rate">8</span></label></header><p>Quatro quadros por sequência. Os recortes usam as coordenadas do atlas JSON. Orientação frontal/sul.</p><main id="grid"></main><script src="atlas-data.js"></script><script>
const phase=document.querySelector('#phase'),grid=document.querySelector('#grid'),fps=document.querySelector('#fps');let entries=[],running=true,elapsed=0,last=0;
for(const sheet of REXX_ENEMY_ATLAS.sheets){const o=document.createElement('option');o.value=sheet.id;o.textContent=sheet.name;phase.append(o);}
function show(){entries=[];grid.innerHTML='';const sheet=REXX_ENEMY_ATLAS.sheets.find(s=>s.id===phase.value),img=new Image();img.src=sheet.image;for(const [id,anim]of Object.entries(sheet.animations)){const card=document.createElement('article'),canvas=document.createElement('canvas'),title=document.createElement('h3'),label=document.createElement('small');canvas.width=360;canvas.height=380;title.textContent=anim.name;label.textContent=id+' · 4 quadros';card.append(canvas,title,label);grid.append(card);entries.push({canvas,img,anim});}}
phase.onchange=show;document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'Pausar animação':'Continuar animação';};fps.oninput=()=>document.querySelector('#rate').textContent=fps.value;
function loop(t){if(running)elapsed+=Math.min(50,t-last);last=t;const frame=Math.floor(elapsed/1000*Number(fps.value))%4;for(const{canvas,img,anim}of entries){const c=canvas.getContext('2d');c.clearRect(0,0,360,380);c.fillStyle='#16333c';c.beginPath();c.ellipse(180,320,75,15,0,0,7);c.fill();if(img.complete&&img.naturalWidth){const f=anim.frames[frame],scale=Math.min(300/anim.maxWidth,300/anim.maxHeight);c.imageSmoothingEnabled=false;c.drawImage(img,f.x,f.y,f.w,f.h,180-f.w*scale/2,325-f.h*scale,f.w*scale,f.h*scale);}}requestAnimationFrame(loop);}show();requestAnimationFrame(loop);
</script></html>
